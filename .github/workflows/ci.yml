name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
  workflow_call:

# on main, every push is published, so none is cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check lantern tests
          ruff format --check lantern tests

      - name: Run mypy
        run: mypy


  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/


  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      # the installed wheel, not the checkout, so a file missing from the package fails the tests
      - name: Install built wheel with dev dependencies
        run: pip install "$(ls dist/*.whl)[dev]"

      - name: Run tests
        run: pytest

