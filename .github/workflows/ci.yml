name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run ruff
        run: pip install ruff && ruff check lantern


  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install REUSE tool
        run: pip install reuse

      - name: Check copyright and license metadata
        run: reuse lint


  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/


  smoke:
    name: Smoke-test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      # the catalogue alone: Lantern reads plots.yaml from the working folder, and the source folder would shadow
      # the installed package
      - name: Checkout the catalogue
        uses: actions/checkout@v6
        with:
          sparse-checkout: /plots.yaml
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: Install built wheel
        run: pip install "$(ls dist/*.whl)"

      - name: Load the catalogue with the installed package
        run: python -c "from lantern.config import load_config; print(len(load_config().plots), 'plots')"
