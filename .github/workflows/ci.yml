name: CI

# The package is built once; the tests run on that wheel, and a published release uploads the same files to PyPI.
on:
  push:
    branches: [ main, dev ]
  pull_request:
  release:
    types: [ published ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check lantern tests
          ruff format --check lantern tests

      - name: Run mypy
        run: mypy


  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist/


  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      matrix:
        python-version: [ '3.12', '3.13' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      # the tests import the installed wheel, not the checkout, so a file missing from the package fails them
      - name: Install built wheel with dev dependencies
        run: pip install "$(ls dist/*.whl)[dev]"

      - name: Run tests
        run: pytest


  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [ lint, build, test ]
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: Check the tag matches the built version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/lantern_zcs-$version.tar.gz" ]; then
            echo "::error::release $GITHUB_REF_NAME does not match the built package: $(ls dist)"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
