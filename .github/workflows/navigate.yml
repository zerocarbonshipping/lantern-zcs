name: Navigate

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      navigate_ref:
        description: Navigate branch, tag or commit, or 'release' for the latest release
        default: dev

jobs:
  navigate:
    name: Test on Navigate ${{ matrix.navigate }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # a scheduled run tests the Navigate in the making and the one users install
        navigate: ${{ fromJSON(inputs.navigate_ref && format('["{0}"]', inputs.navigate_ref) || '["dev", "release"]') }}

    steps:
      - name: Resolve the Navigate ref
        id: navigate
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ matrix.navigate }}
        run: |
          if [ "$REF" = release ]; then
            REF=$(gh release view --repo zerocarbonshipping/navigate-zcs --json tagName --jq .tagName)
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # a scheduled run checks out main otherwise
      - name: Checkout Lantern
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - name: Checkout Navigate
        uses: actions/checkout@v6
        with:
          repository: zerocarbonshipping/navigate-zcs
          ref: ${{ steps.navigate.outputs.ref }}
          path: navigate-zcs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Navigate and Lantern
        run: pip install ./navigate-zcs ".[dev]"

      - name: Write the fixture with Navigate
        run: |
          navigate navigate-zcs/tests/end_to_end/simulations/attribute_coverage/attribute_coverage.nav \
            -d navigate-zcs/assumptions --output-dir navigate-output
          cp navigate-output/attribute_coverage.parquet tests/fixtures/attribute_coverage.parquet

      - name: Run tests
        run: pytest
