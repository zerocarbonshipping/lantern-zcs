name: Publish

# Every push to main is a release: the checks of ci.yml run, then the wheel and sdist they built and tested go to PyPI.
# PyPI refuses a version it already has, so a push to main without a new version in pyproject.toml fails here.
on:
  push:
    branches: [ main ]

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: ci
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
