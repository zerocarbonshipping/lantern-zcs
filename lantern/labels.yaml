# Display names and colours of the labels that tell series apart: fuel types,
# fuels, feedstocks, fleets, vessels, processes, producers, plants, energy demand
# types and the attribute names plots label their series with.
#
#   label: Display name
#   label: {name: Display name, color: blue_4}
#
# A colour is a name the theme (theme.yaml in the repository) gives a hex value,
# or a hex value; a label without one, or without a theme, takes the next
# palette colour, Plotly's without a theme. The order here is the stacking and panel order;
# labels not listed come after, alphabetically. The groups only organise the file.

