label = "attribute"
dash = "dot"
series = ["fleet/*/minimum_speed", "fleet/*/maximum_speed"]

[[plots.layers]]
label = "attribute"
dash = "dashdot"
series = ["fleet/*/lowest_speed", "fleet/*/highest_speed"]

[[plots.layers]]
label = "attribute"
dash = "dash"
series = "fleet/*/reference_speed"

[[plots.layers]]
label = "attribute"
series = ["fleet/*/optimal_speed", "fleet/*/actual_speed"]

[[plots]]
