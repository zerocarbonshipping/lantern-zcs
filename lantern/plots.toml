# Lantern's plot catalogue: which series each plot shows, their names, units and
# axes. Colours and chart styling live in style.toml.
#
# [[plots]] keys: id, title, section, unit (default: the file's unit of the
# first attribute), facet = "node" | "attribute" | "key1" | "key2" | "label"
# (one panel each), split = the same but "label" (one view each, picked in the
# page), rangemode = "normal" for negative values, and unstack = true for a
# stack plot to come first as lines, one panel per label with its band, then as
# "<title> (Stacked)", id "<id>_stacked"; a facet it has becomes the lines' split.
#
# Layer keys, on the plot or in [[plots.layers]]:
#   series      "kind/node/attribute/key1/key2", * as wildcard, missing parts
#               match all; the global profile has the empty node: "global//x"
#   kind        line (default), stack or area; an ensemble's lines and areas
#               get a band from the 5th to the 95th percentile, its stacks show
#               the medians
#   label       key1 (default), key2, node, attribute, or "none" to sum all
#   name        series name for label = "none" or a series without key
#   scale       factor the values are multiplied by, e.g. -1 to draw below
#               zero or 100 for a percentage
#   dash        plotly line dash for targets and limits, e.g. "dash"
#
# Series that are zero or missing throughout are left out; missing values, such
# as a limit without bound, are not drawn.

# Canonical stacking and panel order: fuel types, fuels, feedstocks, shore power,
# then the categories some plots stack. Labels not listed follow alphabetically.
order = [
    # fuel types: fossil first, then the green fuels, hydrogen and electricity last
    "OIL", "LPG", "METHANE", "METHANOL", "ETHANOL", "AMMONIA", "HYDROGEN", "ELECTRICITY",
    # fuels: fossil first, then bio, then blue and electro, electricity last
    "fossil_fuel_oil", "heavy_fuel_oil", "liquefied_petroleum_gas", "liquefied_natural_gas", "ammonia_grey",
    "fatty_acid_methyl_ester", "oil_bio", "methanol_bio", "ethanol_bio", "methane_bio", "ammonia_blue",
    "ammonia_electro", "methanol_electro", "methane_electro", "diesel_electro", "electricity",
    # feedstocks
    "crude_oil", "natural_gas", "methanol_grey", "used_cooking_oil", "feedstock_biogas",
    "feedstock_bioethanol_fermentation", "feedstock_biomethanol_gasification", "carbon_dioxide_biogenic",
    "demineralized_water",
    "shore_power",
    # energy demand types
    "PROPULSION", "ELECTRICAL", "HEAT",
    # expense categories
    "vessel_expenses", "fuel_conversion_expenses", "technology_expenses", "total_fuel_expenses",
    "total_levy_expenses", "regulation_expenses",
    "cumulative_vessel_expenses", "cumulative_fuel_conversion_expenses", "cumulative_technology_expenses",
    "cumulative_total_fuel_expenses", "cumulative_total_levy_expenses", "cumulative_regulation_expenses",
]

