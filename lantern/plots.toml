# Colours, keyed like [labels]; other labels take the style palette.


# ---------------------------------------------------------------------------
# Global
# ---------------------------------------------------------------------------

[[plots]]
id = "global_emission_absolute"
section = "Global"
title = "WTW emissions"
label = "none"
series = "global//total_equivalent_wtw"

[[plots]]
id = "global_emission_intensity"
section = "Global"
title = "WTW emission intensity"
label = "none"
series = "global//intensity_total_equivalent_wtw"

[[plots]]
id = "global_fuel_consumed"
section = "Global"
title = "Fuel consumed"
kind = "stack"
name = "shore_power"
series = ["global//consumed_energy", "global//shore_power_energy"]

[[plots]]
id = "global_fuel_type_consumed"
section = "Global"
title = "Fuel consumed by fuel type"
kind = "stack"
name = "shore_power"
series = ["global//fuel_type_energy", "global//shore_power_energy"]

[[plots]]
id = "global_energy_demand"
section = "Global"
title = "Energy demand by demand type"
kind = "stack"
# in port, vessels demand electrical energy and heat only
series = ["global//energy_sea", "global//energy_port"]

[[plots]]
id = "global_energy_saving"
section = "Global"
title = "Energy saving"
unit = "%"

[[plots.layers]]
series = "global//saving"
transforms = ["scale:100"]

[[plots.layers]]
label = "attribute"
dash = "dash"
series = [
    "global//technology_energy_intensity_saving",
    "global//operational_energy_intensity_saving",
    "global//energy_intensity_saving",
]
transforms = ["scale:100"]

[[plots]]
id = "global_installed_power"
section = "Global"
title = "Installed power by fuel type"
kind = "stack"
series = "global//installed_power"

[[plots]]
id = "global_power_converted_cumulative"
section = "Global"
title = "Cumulative power converted from (below) and to (above) each fuel type"
rangemode = "normal"

[[plots.layers]]
kind = "stack"
series = "global//fuel_converted_power"
transforms = ["cumulative", "negate"]

[[plots.layers]]
kind = "stack"
label = "key2"
series = "global//fuel_converted_power"
transforms = ["cumulative"]

[[plots]]
id = "global_feedstock_consumption"
section = "Global"
# the feeds include the processes of the supply chain, not only the feedstocks
title = "Feed consumption against constraint"
facet = "key1"

[[plots.layers]]
kind = "area"
label = "none"
series = "global//feed_mass"

[[plots.layers]]
label = "none"
series = "global//feed_constraint"

[[plots]]
id = "global_fuel_related_expenses"
section = "Global"
title = "Fuel-related expenses"
kind = "stack"
label = "attribute"
series = ["global//total_fuel_expenses", "global//total_levy_expenses", "global//regulation_expenses"]

[[plots]]
id = "global_fuel_related_expenses_cumulative"
section = "Global"
title = "Cumulative fuel-related expenses"
kind = "stack"
label = "attribute"
series = ["global//total_fuel_expenses", "global//total_levy_expenses", "global//regulation_expenses"]
transforms = ["cumulative"]

[[plots]]
id = "global_expenses"
section = "Global"
title = "Expenses"
kind = "stack"
label = "attribute"
series = [
    "global//vessel_expenses",
    "global//fuel_conversion_expenses",
    "global//technology_expenses",
    "global//total_fuel_expenses",
    "global//total_levy_expenses",
    "global//regulation_expenses",
]

[[plots]]
id = "global_expenses_cumulative"
section = "Global"
title = "Cumulative expenses"
kind = "stack"
label = "attribute"
series = [
    "global//vessel_expenses",
    "global//fuel_conversion_expenses",
    "global//technology_expenses",
    "global//total_fuel_expenses",
    "global//total_levy_expenses",
    "global//regulation_expenses",
]
transforms = ["cumulative"]

[[plots]]
id = "global_tied_capital"
section = "Global"
title = "Capital tied in vessels and plants"
label = "attribute"
series = ["global//vessel_tied_capital", "global//plant_tied_capital"]

