#         total: true
#       - series: regulation.shared_threshold
#         total: true
#         line: dash
#       - series: regulation.adjusted_shared_threshold
#         total: true
#         line: dot

  unit_trading:
    title: Compliance units
    select_view: node
    split_by: attribute
    series:
      - regulation.non_compliance_units
      - regulation.surplus_units

  flexibility_cost:
    title: Compliance costs
    select_view: node
    split_by: attribute
    series:
      - regulation.remedial_cost
      - regulation.flexibility_cost
