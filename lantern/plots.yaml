# Lantern's plot catalogue: which series each plot shows, its panels and axes.
# The names, colours and order of the labels are in labels.yaml.
#
# Plots are listed under their section; a plot's id is "<section>_<key>".
# PLOTS.md in the repository is the manual.
#
# customize_runs, which is not a section, gives a run a display name and a colour by its
# name, as labels.yaml does a label: a colour name of the theme or a hex value.
# Runs not listed are shown as named and take the palette in turn.
#
# Plot keys:
#   title        heading of the plot
#   unit         y-axis unit; default: the file's unit of the first series
#   panels       one panel per node, attribute, key1 or key2
#   select_view  one view per node, attribute, key1 or key2, chosen in the page
#   y_axis       zero (default) to start the y axis at zero, fit to fit it to
#                the data
#   variants     for a stack, [lines, stack] to list it first as lines, one
#                panel per label, then as "<title> (Stacked)", id
#                "<id>_stacked"; the stack's panels become the lines' views
#   layers       series drawn in different ways, each a list item with the
#                layer keys; a plot of one layer has them on the plot itself
#
# Layer keys:
#   series       "kind.attribute", or a list of them: the attribute of every
#                node of the kind, e.g. "fleet.newbuilds"; the global profile
#                is "global.<attribute>"
#   draw         line (default), stack or area
#   split_by     the column that tells the series apart and labels them: key1
#                (default), key2, node or attribute
#   total        true to sum all series into one
#   label        label of the total, or of a series without a split_by value
#   scale        factor the values are multiplied by, e.g. -1 to draw below
#                zero or 100 for a percentage
#   line         plotly line dash for targets and limits: dash, dot or dashdot
#   cumulative   true to sum a rate over the time steps up to each date, as
#                Navigate's CUMULATIVE report does; give the plot its unit
#   per_gj       true to divide a per-ton value by the heating value of its
#                fuel, e.g. USD/t to USD/GJ: the fuel in key1, or a plant's own
#                fuel, as the results file's metadata gives them; give the plot
#                its unit
#
# Series that are zero or missing throughout are left out; missing values, such
# as a limit without bound, are not drawn. Text that YAML reads as another type,
# such as no, on or 2030, must be quoted; Lantern stops at its line otherwise.

customize_runs:
  no_regulation:     {name: No regulation, color: grey_4}
  weak_regulation:   {name: Weak regulation, color: yellow_4}
  mid_regulation:    {name: Mid regulation, color: blue_4}
  strong_regulation: {name: Strong regulation, color: green_4}

main:
  emission_absolute:
    title: WTW emissions
    total: true
    series: global.total_equivalent_wtw

  emission_intensity:
    title: WTW emission intensity
    total: true
    series: global.intensity_total_equivalent_wtw

  fuel_consumed:
    title: Fuel consumed
    variants: [lines, stack]
    draw: stack
    label: shore_power
    series:
      - global.consumed_energy
      - global.shore_power_energy

  fuel_type_consumed:
    title: Fuel consumed by type
    variants: [lines, stack]
    draw: stack
    label: shore_power
    series:
      - global.fuel_type_energy
      - global.shore_power_energy

  # in port, vessels demand electrical energy and heat only
  energy_demand:
    title: Energy demand
    variants: [lines, stack]
    draw: stack
    series:
      - global.energy_sea
      - global.energy_port

  energy_saving:
    title: Energy saving
    unit: "%"
    layers:
      - series: global.saving
        scale: 100
      - series:
          - global.technology_energy_intensity_saving
          - global.operational_energy_intensity_saving
          - global.energy_intensity_saving
        split_by: attribute
        scale: 100
        line: dash

  installed_power:
    title: Installed power
    variants: [lines, stack]
    draw: stack
    series: global.installed_power

  power_converted_from:
    title: Power converted from
    variants: [lines, stack]
    draw: stack
    series: global.fuel_converted_power

  power_converted_to:
    title: Power converted to
    variants: [lines, stack]
    draw: stack
    split_by: key2
    series: global.fuel_converted_power

  # the feeds include the processes of the supply chain, not only the feedstocks
  feedstock_consumption:
    title: Feed consumption
    panels: key1
    layers:
      - series: global.feed_mass
        total: true
      - series: global.feed_constraint
        total: true
        line: dash

  fuel_related_expenses:
    title: Fuel expenses
    variants: [lines, stack]
    draw: stack
    split_by: attribute
    series:
      - global.total_fuel_expenses
      - global.levy_expenses
      - global.regulation_expenses

  fuel_related_expenses_cumulative:
    title: Cumulative fuel expenses
    unit: USD
    variants: [lines, stack]
    draw: stack
    split_by: attribute
    cumulative: true
    series:
      - global.total_fuel_expenses
      - global.levy_expenses
      - global.regulation_expenses

  expenses:
    title: Expenses
    variants: [lines, stack]
    draw: stack
    split_by: attribute
    series:
      - global.vessel_expenses
      - global.fuel_conversion_expenses
      - global.technology_expenses
      - global.total_fuel_expenses
      - global.levy_expenses
      - global.regulation_expenses

  expenses_cumulative:
    title: Cumulative expenses
    unit: USD
    variants: [lines, stack]
    draw: stack
    split_by: attribute
    cumulative: true
    series:
      - global.vessel_expenses
      - global.fuel_conversion_expenses
      - global.technology_expenses
      - global.total_fuel_expenses
      - global.levy_expenses
      - global.regulation_expenses

  tied_capital:
    title: Tied capital
    split_by: attribute
    series:
      - global.vessel_tied_capital
      - global.plant_tied_capital

fuel:
  type_supply_demand:
    title: Supply and fleet capacity
    panels: key1
    layers:
      - series: global.fuel_type_capacity
        total: true
        line: dash
      - series: global.production_type_energy
        total: true
        line: dash

  supply_demand:
    title: Consumed and produced
    panels: key1
    layers:
      - series: global.consumed_energy
        draw: area
        total: true
      - series: global.production_energy
        total: true

engine:
  fuel_consumed:
    title: Fuel consumed
    panels: key1
    variants: [lines, stack]
    draw: stack
    split_by: key2
    series: global.converter_energy

  age:
    title: Vessel age
    panels: key1
    series: global.weighted_average_age

  pilot_fuel_share:
    title: Pilot fuel share
    unit: "%"
    panels: key1
    scale: 100
    series: global.pilot_fuel_share

fleet:
  emission_absolute:
    title: WTW emissions
    panels: node
    total: true
    series: fleet.total_equivalent_wtw

  emission_intensity:
    title: WTW emission intensity
    panels: node
    total: true
    series: fleet.intensity_total_equivalent_wtw

  fuel_consumed:
    title: Fuel consumed
    panels: node
    variants: [lines, stack]
    draw: stack
    label: shore_power
    series:
      - fleet.consumed_energy
      - fleet.shore_power_energy

  evolution:
    title: Vessels
    panels: node
    variants: [lines, stack]
    draw: stack
    series: fleet.existing_vessels

  changes:
    title: Newbuilds and scrapping
    unit: vessels/year
    panels: node
    y_axis: fit
    variants: [lines, stack]
    layers:
      - series: fleet.scrap
        draw: stack
        scale: -1
      - series: fleet.newbuilds
        draw: stack

  conversions_cumulative:
    title: Cumulative conversions
    unit: vessels
    panels: node
    y_axis: fit
    variants: [lines, stack]
    layers:
      - series: fleet.fuel_conversions
        draw: stack
        scale: -1
        cumulative: true
      - series: fleet.fuel_conversions
        draw: stack
        split_by: key2
        cumulative: true

  energy_saving:
    title: Energy saving
    unit: "%"
    panels: node
    y_axis: fit
    split_by: attribute
    scale: 100
    series:
      - fleet.operational_energy_intensity_saving
      - fleet.technology_energy_intensity_saving
      - fleet.energy_intensity_saving

  # a fleet without speed management has only its reference speed
  speed:
    title: Fleet speed
    panels: node
    layers:
      - series:
          - fleet.minimum_speed
          - fleet.maximum_speed
        split_by: attribute
        line: dot
      - series:
          - fleet.lowest_speed
          - fleet.highest_speed
        split_by: attribute
        line: dashdot
      - series: fleet.reference_speed
        split_by: attribute
        line: dash
      - series:
          - fleet.optimal_speed
          - fleet.actual_speed
        split_by: attribute

  speed_per_vessel:
    title: Vessel speed
    panels: node
    layers:
      - series:
          - vessel.minimum_speed
          - vessel.maximum_speed
        split_by: attribute
        line: dot
      - series: vessel.actual_speed
        split_by: attribute

  investment_metric:
    title: Freight rates
    unit: USD/1000 cargo-miles
    panels: node
    layers:
      - series: vessel.investment_freight_rate
        total: true
        scale: 1000
        line: dash
      - series: vessel.instantaneous_freight_rate
        total: true
        scale: 1000

producer:
  development:
    title: Plant development
    panels: node
    layers:
      - series: producer.development
        total: true
      - series: producer.maximum_development
        total: true
        line: dash

  development_cumulative:
    title: Cumulative plant development
    unit: plants
    panels: node
    layers:
      - series: producer.development
        total: true
        cumulative: true
      - series: producer.maximum_development
        total: true
        line: dash
        cumulative: true

  feed_consumption:
    title: Feed consumption
    panels: key1
    select_view: node
    layers:
      - series: producer.feed_mass
        total: true
      - series: producer.feed_constraint
        total: true
        line: dash

plant:
  production_cost:
    title: Production cost
    unit: USD/GJ
    panels: node
    y_axis: fit
    layers:
      - series: plant.investment_cost
        total: true
        line: dash
        per_gj: true
      - series: plant.instantaneous_cost
        total: true
        per_gj: true

port:
  bunker_price:
    title: Bunker price
    unit: USD/GJ
    select_view: node
    per_gj: true
    series: port.bunker_price

  # a liquid-market fuel has no supply or infrastructure limit, only its bunkered mass
  bunker_supply:
    title: Bunkered fuel and supply
    panels: key1
    select_view: node
    layers:
      - series: port.bunker_mass
        draw: area
        total: true
      - series: port.bunker_supply_mass
        total: true
      - series: port.bunkering_limit_mass
        total: true
        line: dash

regulation:
  # left out for now: a panel per vessel makes it by far the slowest plot to prepare
#   # one panel per vessel, and one without a title for the shared compliance
#   compliance:
