  unit_trading:
    title: Non-compliance and surplus units
    views: node
    by: attribute
    series:
      - regulation.non_compliance_units
      - regulation.surplus_units

  flexibility_cost:
    title: Remedial and flexibility cost
    views: node
    by: attribute
    series:
      - regulation.remedial_cost
      - regulation.flexibility_cost
