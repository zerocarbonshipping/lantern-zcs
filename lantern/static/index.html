<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern</title>
  <link rel="stylesheet" href="/app.css">
  <!-- the theme kept in this browser, set before the page is drawn so a dark one does not flash bright -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("lantern.theme") || "system"; } catch {}</script>
  <script src="/plotly.js" defer></script>
  <script src="/buttons.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <nav>
    <div class="head">
      <img class="logo" src="/logo.svg" alt=""><b>Lantern</b>
      <div id="theme" role="radiogroup" aria-label="Colour theme">
        <label title="System"><input type="radio" name="theme" value="system" aria-label="System"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg></label>
        <label title="Bright"><input type="radio" name="theme" value="bright" aria-label="Bright"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.5 1.5M11.5 11.5 13 13M3 13l1.5-1.5M11.5 4.5 13 3"/></svg></label>
        <label title="Dark"><input type="radio" name="theme" value="dark" aria-label="Dark"><svg viewBox="0 0 16 16"><path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z" fill="currentColor"/></svg></label>
      </div>
    </div>
    <div id="plots"></div>
  </nav>
  <div class="gutter" data-column="nav" title="Drag to resize"></div>
  <main>
    <p id="offline" hidden>Lantern is not running; start it again and this page picks it up</p>
    <p id="empty" class="empty">Drop Navigate results files here, or add them on the right.</p>
    <div id="toolbar" hidden><h2 id="title"></h2><select id="view" hidden></select><select id="panel" hidden></select></div>
    <div id="figure"></div>
    <p id="message"></p>
  </main>
  <div class="gutter" data-column="aside" title="Drag to resize"></div>
  <aside>
    <div class="head">
      <label class="button">Add files<input id="files" type="file" accept=".parquet" multiple hidden></label>
      <button id="refresh" class="button" title="Reload plots.yaml and the results files Lantern was opened with from disk">Refresh</button>
    </div>
    <h4>Runs</h4><p class="hint">Ctrl-click runs to compare them</p><ul id="runs"></ul>
  </aside>
</body>
</html>
