[build-system]
requires = ["setuptools>=68.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-zcs"
version = "2.0.0"
authors = [
    { name = "Mathias Hintze", email = "mathias.hintze@zerocarbonshipping.com" },
    { name = "Julius Thomas", email = "julius.thomas@zerocarbonshipping.com"}
]
maintainers = [
    { name = "Frederik Winkel Lehn", email = "frederik.lehn@zerocarbonshipping.com" },
]
description = "Browser viewer for Navigate results files: interactive Plotly plots of one or several runs"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "plotly>=6.0",
    "polars>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff", "reuse"]
# --plot renders PNG through kaleido, which needs Chrome: plotly_get_chrome installs one
export = ["kaleido>=1.0"]

[project.urls]
Homepage = "https://www.zerocarbonshipping.com/"
Repository = "https://github.com/zerocarbonshipping/lantern-zcs"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.setuptools.package-data]
lantern = ["labels.yaml", "theme.yaml", "static/*"]

[project.scripts]
lantern = "lantern.__main__:main"

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N"]
