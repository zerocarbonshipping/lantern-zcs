[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-zcs"
version = "2.0.0"
authors = [
    { name = "Mathias Hintze", email = "mathias.hintze@zerocarbonshipping.com" },
    { name = "Julius Thomas", email = "julius.thomas@zerocarbonshipping.com"}
]
maintainers = [
    { name = "Frederik Winkel Lehn", email = "frederik.lehn@zerocarbonshipping.com" },
]
description = "Browser viewer for Navigate results files: interactive Plotly plots of one or several runs"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
    "plotly>=6.0",
    "polars>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.5",
    "mypy==2.3.1",
    "types-PyYAML",
    "types-tqdm",
    "pytest>=9.0",
]

[project.urls]
Homepage = "https://www.zerocarbonshipping.com/"
Repository = "https://github.com/zerocarbonshipping/lantern-zcs"

[tool.setuptools.packages.find]
include = ["lantern*"]

[tool.setuptools.package-data]
lantern = ["labels.yaml", "theme.yaml", "static/*"]

[project.scripts]
lantern = "lantern.__main__:main"

[tool.ruff]
line-length = 128
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# preview rules are opt-in one at a time, by full code, in extend-select below
preview = true
explicit-preview-rules = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "D",   # pydocstyle
    "TC",  # flake8-type-checking
    "SLF", # flake8-self
    "ICN", # canonical import aliases (polars as pl, ...)
    "PGH", # bans blanket noqa/type-ignore
    "G",   # flake8-logging-format: lazy % arguments, extra keys clear of LogRecord's
    "LOG", # flake8-logging: no root-logger calls, exc_info only in except handlers
    "RET", # flake8-return: no else after an exit, no assign-then-return
    "PTH", # flake8-use-pathlib: pathlib over os.path, os file calls and open()
    "PT",  # flake8-pytest-style
]
extend-select = [
    "D213",    # multi-line docstring summaries start on the second line
    "D417",    # every argument appears in a Parameters section that exists
    "DOC102",  # every documented parameter exists in the signature
    "DOC202",  # no Returns section on a function that returns nothing
    "ERA001",  # no commented-out code
    "PLW2901", # a loop variable is not rebound in the loop body
    "PLW3301", # nested min/max calls are flattened into one
]
ignore = [
    "D105", # magic methods need no docstring
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["lantern"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
# a variable may be rebound to a new type, so the loops of one function can share names
allow_redefinition_new = true
local_partial_types = true

# plotly ships neither inline types nor stubs
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true
