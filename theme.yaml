# Lantern theme of the Mærsk Mc-Kinney Møller Center for Zero Carbon Shipping: the
# Center's colours. Lantern reads it from here, next to the package, when run from
# the repository; it is not part of the package, which takes Plotly's colours.
#
#   swatches  hex value of each colour name labels.yaml gives a label
#   palette   colours, in turn, of labels without one and of runs compared in one panel

palette: [blue_5, yellow_4, green_4, red_4, blue_4,
          yellow_5, green_3, red_5, grey_3, blue_6]

# Center colours by palette and shade (0 lightest, 6 darkest)
swatches:
  blue_2: "#b8e4f4"
  blue_3: "#96c8e4"
  blue_4: "#68a4c2"
  blue_5: "#3c5e86"
  blue_6: "#2c4068"
  green_1: "#dcf0d6"
  green_2: "#b8e0c2"
  green_3: "#6ea49a"
  green_4: "#447a7a"
  green_5: "#286464"
  grey_1: "#dcdcdc"
  grey_2: "#bebebe"
  grey_3: "#8c8c8c"
  grey_4: "#585858"
  grey_5: "#414141"
  grey_6: "#323232"
  red_2: "#fac8c2"
  red_3: "#e0a4a4"
  red_4: "#c28080"
  red_5: "#9e5858"
  red_6: "#804040"
  yellow_2: "#fae6aa"
  yellow_3: "#fad690"
  yellow_4: "#e8c27c"
  yellow_5: "#bc8e54"
